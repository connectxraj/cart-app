<!DOCTYPE html>
<html>
<head>
  <title>DawaiiX Cart</title>
  <meta charset="UTF-8">
</head>
<body>

<h2>Add to Cart</h2>

<label>Product</label><br>
<select id="product">
  <option value="Crocin">Crocin</option>
  <option value="Paracetamol">Paracetamol</option>
</select>
<br><br>

<label>MRP</label><br>
<input type="number" id="mrp" value="60" oninput="calculateTotal()">
<br><br>

<label>Quantity</label><br>
<input type="number" id="qty" value="1" oninput="calculateTotal()">
<br><br>

<label>Discount %</label><br>
<input type="number" id="discount" value="0" oninput="calculateTotal()">
<br><br>

<p><b>Total: ₹ <span id="total">60.00</span></b></p>

<button onclick="submitCart()">Add to Cart</button>

<script>
function calculateTotal() {
  const mrp = Number(document.getElementById("mrp").value);
  const qty = Number(document.getElementById("qty").value);
  const discount = Number(document.getElementById("discount").value);

  const discountedPrice = mrp - (mrp * discount / 100);
  const total = discountedPrice * qty;

  document.getElementById("total").innerText = total.toFixed(2);
}

function submitCart() {
  const payload = {
    cartId: "CART-" + Date.now(),
    userEmail: "guest@dawaiix.com",
    productName: document.getElementById("product").value,
    companyName: "",
    subCategory: "",
    mrp: Number(document.getElementById("mrp").value),
    discount: Number(document.getElementById("discount").value),
    price: Number(document.getElementById("total").innerText),
    quantity: Number(document.getElementById("qty").value)
  };

  fetch("https://script.google.com/macros/s/AKfycbwHB0O2GL23ogX7QAAdIqTYWxzgJ-XKmGcdhMdP-K2WPQFHwux4h0f5TtzGjNmi6hwy/exec", {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
  .then(() => {
    alert("✅ Item added to cart");
  })
  .catch(() => {
    alert("❌ Server error");
  });
}
</script>

</body>
</html>
